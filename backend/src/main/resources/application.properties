# application-local.properties
# Copy this file, rename to application.properties, and fill in values.
# DO NOT commit application.properties if it contains real secrets.

spring.application.name=healthcare-backend
server.port=8081

# ─── Database — H2 In-Memory (default for development) ────────
spring.datasource.url=jdbc:h2:mem:healthcaredb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Database — MySQL (uncomment to switch to MySQL) ──────────
# spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=YOUR_MYSQL_USERNAME
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ─── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ─── Swagger / OpenAPI ────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ─── JWT ──────────────────────────────────────────────────────
# IMPORTANT: Replace this with a strong random secret in production
jwt.secret=REPLACE_WITH_A_STRONG_64_CHAR_SECRET_KEY_HERE
jwt.expiration=86400000

# ─── File Upload ──────────────────────────────────────────────
file.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
