services:
  - type: web
    name: medicare-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        # Update this to your actual Vercel frontend URL once deployed
        value: "https://your-vercel-app-url.vercel.app"
